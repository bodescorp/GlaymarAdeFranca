name: sync-catalogos

on:
  push:
    branches: [master]
    paths:
      - "projetos/**"
      - "artigos/**"
      - "scripts/sync-catalogos.py"
      - "scripts/sync-projetos.py"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualiza manifests das pastas
        run: python3 scripts/sync-catalogos.py
      - name: Grava manifests se mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projetos/manifest.json artigos/manifest.json
          if git diff --staged --quiet; then
            echo "manifests sem mudanças"
          else
            git commit -m "chore: atualiza manifest de projetos e artigos"
            git push
          fi
